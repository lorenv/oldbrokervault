<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900">
  <defs>
    <!-- Gradients -->
    <linearGradient id="serverGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="dbGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#059669;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#047857;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="browserGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4f46e5;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="aiGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="serviceGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#64748b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#475569;stop-opacity:1" />
    </linearGradient>
    
    <!-- Drop shadow filter -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.15"/>
    </filter>
    
    <!-- Arrow marker -->
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <marker id="arrowheadGreen" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#059669"/>
    </marker>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="900" fill="#f8fafc"/>
  
  <!-- Title -->
  <text x="600" y="45" font-family="Inter, system-ui, sans-serif" font-size="28" font-weight="700" fill="#1e293b" text-anchor="middle">CIM Share — Data Flow Architecture</text>
  <text x="600" y="70" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#64748b" text-anchor="middle">Security & Compliance Overview</text>
  
  <!-- ==================== CUSTOMER BROWSER (Left) ==================== -->
  <g filter="url(#dropShadow)">
    <rect x="40" y="200" width="200" height="280" rx="12" fill="url(#browserGradient)"/>
  </g>
  <!-- Browser icon -->
  <rect x="60" y="220" width="160" height="100" rx="6" fill="#fff" opacity="0.2"/>
  <circle cx="80" cy="235" r="5" fill="#ef4444"/>
  <circle cx="98" cy="235" r="5" fill="#f59e0b"/>
  <circle cx="116" cy="235" r="5" fill="#22c55e"/>
  <rect x="70" y="250" width="140" height="60" rx="4" fill="#fff" opacity="0.3"/>
  
  <text x="140" y="345" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="600" fill="#fff" text-anchor="middle">Customer Browser</text>
  
  <!-- Upload items -->
  <text x="140" y="375" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#e0e7ff" text-anchor="middle">Uploads:</text>
  <text x="140" y="395" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#c7d2fe" text-anchor="middle">• Meeting transcripts</text>
  <text x="140" y="410" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#c7d2fe" text-anchor="middle">• Financial data</text>
  <text x="140" y="425" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#c7d2fe" text-anchor="middle">• Images &amp; logos</text>
  <text x="140" y="440" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#c7d2fe" text-anchor="middle">• Company descriptions</text>
  
  <!-- Lock icon on browser -->
  <circle cx="215" cy="220" r="14" fill="#22c55e"/>
  <path d="M210 218 v-3 a5 5 0 0 1 10 0 v3" stroke="#fff" stroke-width="2" fill="none"/>
  <rect x="207" y="218" width="16" height="11" rx="2" fill="#fff"/>
  
  <!-- ==================== CIM SHARE SERVER (Center) ==================== -->
  <g filter="url(#dropShadow)">
    <rect x="420" y="160" width="280" height="360" rx="12" fill="url(#serverGradient)"/>
  </g>
  
  <!-- Server icon -->
  <rect x="520" y="180" width="80" height="20" rx="4" fill="#fff" opacity="0.3"/>
  <circle cx="535" cy="190" r="4" fill="#22c55e"/>
  <circle cx="550" cy="190" r="4" fill="#22c55e"/>
  <rect x="520" y="205" width="80" height="20" rx="4" fill="#fff" opacity="0.3"/>
  <circle cx="535" cy="215" r="4" fill="#22c55e"/>
  <circle cx="550" cy="215" r="4" fill="#22c55e"/>
  <rect x="520" y="230" width="80" height="20" rx="4" fill="#fff" opacity="0.3"/>
  <circle cx="535" cy="240" r="4" fill="#22c55e"/>
  <circle cx="550" cy="240" r="4" fill="#22c55e"/>
  
  <text x="560" y="280" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">CIM Share Server</text>
  <text x="560" y="300" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#bfdbfe" text-anchor="middle">Cloud Infrastructure</text>
  
  <!-- Server capabilities -->
  <rect x="440" y="320" width="240" height="180" rx="8" fill="#fff" opacity="0.15"/>
  <text x="560" y="345" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" fill="#fff" text-anchor="middle">Core Functions</text>
  
  <text x="470" y="370" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#dbeafe">🔐 Authentication &amp; SSO</text>
  <text x="470" y="390" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#dbeafe">📄 Document Generation</text>
  <text x="470" y="410" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#dbeafe">📑 PDF Export Engine</text>
  <text x="470" y="430" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#dbeafe">✍️ E-Signature Processing</text>
  <text x="470" y="450" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#dbeafe">🛡️ Access Control (RBAC)</text>
  <text x="470" y="470" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#dbeafe">📊 Audit Logging</text>
  
  <!-- ==================== POSTGRESQL DATABASE (Below Server) ==================== -->
  <g filter="url(#dropShadow)">
    <rect x="420" y="600" width="280" height="200" rx="12" fill="url(#dbGradient)"/>
  </g>
  
  <!-- Database icon -->
  <ellipse cx="560" cy="635" rx="35" ry="12" fill="#fff" opacity="0.3"/>
  <rect x="525" y="635" width="70" height="35" fill="#fff" opacity="0.2"/>
  <ellipse cx="560" cy="670" rx="35" ry="12" fill="#fff" opacity="0.3"/>
  
  <text x="560" y="700" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">PostgreSQL Database</text>
  
  <!-- AES-256 badge -->
  <rect x="500" y="715" width="120" height="22" rx="11" fill="#fff"/>
  <text x="560" y="730" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="600" fill="#059669" text-anchor="middle">🔒 AES-256 at Rest</text>
  
  <!-- Database contents -->
  <text x="560" y="755" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#d1fae5" text-anchor="middle">User accounts (bcrypt hashed)</text>
  <text x="560" y="770" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#d1fae5" text-anchor="middle">CIM documents &amp; versions</text>
  <text x="560" y="785" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#d1fae5" text-anchor="middle">E-signature audit trails</text>
  
  <!-- ==================== AI SERVICES (Right, Grouped) ==================== -->
  <rect x="820" y="130" width="340" height="290" rx="12" fill="none" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="8,4"/>
  
  <!-- AI Group Label -->
  <rect x="880" y="115" width="220" height="28" rx="6" fill="#f8fafc"/>
  <rect x="885" y="120" width="210" height="18" rx="4" fill="#22c55e"/>
  <text x="990" y="133" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" fill="#fff" text-anchor="middle">✓ No Training on Your Data</text>
  
  <!-- OpenAI -->
  <g filter="url(#dropShadow)">
    <rect x="840" y="160" width="150" height="75" rx="8" fill="url(#aiGradient)"/>
  </g>
  <text x="915" y="185" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#fff" text-anchor="middle">OpenAI (GPT-4)</text>
  <text x="915" y="202" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#e9d5ff" text-anchor="middle">Document Generation</text>
  <rect x="865" y="212" width="100" height="16" rx="8" fill="#fff" opacity="0.9"/>
  <text x="915" y="224" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="500" fill="#7c3aed" text-anchor="middle">SOC 2 Type II</text>
  
  <!-- Anthropic -->
  <g filter="url(#dropShadow)">
    <rect x="1000" y="160" width="150" height="75" rx="8" fill="url(#aiGradient)"/>
  </g>
  <text x="1075" y="185" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#fff" text-anchor="middle">Anthropic (Claude)</text>
  <text x="1075" y="202" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#e9d5ff" text-anchor="middle">Vision &amp; Analysis</text>
  <rect x="1025" y="212" width="100" height="16" rx="8" fill="#fff" opacity="0.9"/>
  <text x="1075" y="224" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="500" fill="#7c3aed" text-anchor="middle">SOC 2 Type II</text>
  
  <!-- Perplexity AI -->
  <g filter="url(#dropShadow)">
    <rect x="920" y="250" width="150" height="75" rx="8" fill="url(#aiGradient)"/>
  </g>
  <text x="995" y="275" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#fff" text-anchor="middle">Perplexity AI</text>
  <text x="995" y="292" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#e9d5ff" text-anchor="middle">Market Research</text>
  <rect x="945" y="302" width="100" height="16" rx="8" fill="#fff" opacity="0.9"/>
  <text x="995" y="314" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="500" fill="#7c3aed" text-anchor="middle">Enterprise API</text>
  
  <!-- Green badges on AI services -->
  <circle cx="980" cy="165" r="10" fill="#22c55e"/>
  <text x="980" y="169" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#fff" text-anchor="middle">✓</text>
  <circle cx="1140" cy="165" r="10" fill="#22c55e"/>
  <text x="1140" y="169" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#fff" text-anchor="middle">✓</text>
  <circle cx="1060" cy="255" r="10" fill="#22c55e"/>
  <text x="1060" y="259" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#fff" text-anchor="middle">✓</text>
  
  <!-- Sub-label for AI data sent -->
  <text x="990" y="360" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">Data sent: Document content only</text>
  <text x="990" y="375" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">(anonymized when possible)</text>
  
  <!-- ==================== OTHER SERVICES (Right, Below AI) ==================== -->
  <text x="990" y="440" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#475569" text-anchor="middle">Third-Party Services</text>
  
  <!-- Stripe -->
  <g filter="url(#dropShadow)">
    <rect x="840" y="460" width="145" height="70" rx="8" fill="url(#serviceGradient)"/>
  </g>
  <text x="912" y="488" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#fff" text-anchor="middle">Stripe</text>
  <text x="912" y="505" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#cbd5e1" text-anchor="middle">Payments</text>
  <rect x="862" y="512" width="100" height="14" rx="7" fill="#fff"/>
  <text x="912" y="522" font-family="Inter, system-ui, sans-serif" font-size="8" font-weight="500" fill="#475569" text-anchor="middle">PCI DSS Level 1</text>
  
  <!-- SendGrid -->
  <g filter="url(#dropShadow)">
    <rect x="1000" y="460" width="145" height="70" rx="8" fill="url(#serviceGradient)"/>
  </g>
  <text x="1072" y="488" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#fff" text-anchor="middle">SendGrid</text>
  <text x="1072" y="505" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#cbd5e1" text-anchor="middle">Email Delivery</text>
  <rect x="1022" y="512" width="100" height="14" rx="7" fill="#fff"/>
  <text x="1072" y="522" font-family="Inter, system-ui, sans-serif" font-size="8" font-weight="500" fill="#475569" text-anchor="middle">SOC 2</text>
  
  <!-- ==================== DATA FLOW ARROWS ==================== -->
  
  <!-- Browser to Server -->
  <path d="M 240 340 L 410 340" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <rect x="275" y="325" width="90" height="18" rx="4" fill="#f1f5f9"/>
  <text x="320" y="338" font-family="Inter, system-ui, sans-serif" font-size="8" fill="#475569" text-anchor="middle">TLS 1.2+</text>
  
  <!-- Server to Database -->
  <path d="M 560 520 L 560 590" stroke="#059669" stroke-width="2" fill="none" marker-end="url(#arrowheadGreen)"/>
  <rect x="565" y="545" width="70" height="18" rx="4" fill="#f1f5f9"/>
  <text x="600" y="558" font-family="Inter, system-ui, sans-serif" font-size="8" fill="#059669" text-anchor="middle">TLS 1.2+</text>
  
  <!-- Server to OpenAI -->
  <path d="M 700 280 L 840 200" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <rect x="735" y="225" width="55" height="16" rx="4" fill="#f1f5f9"/>
  <text x="762" y="236" font-family="Inter, system-ui, sans-serif" font-size="7" fill="#475569" text-anchor="middle">TLS 1.2+</text>
  
  <!-- Server to Anthropic -->
  <path d="M 700 250 L 1000 200" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Server to Perplexity -->
  <path d="M 700 320 L 920 290" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Server to Stripe -->
  <path d="M 700 400 L 840 480" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <rect x="735" y="425" width="55" height="16" rx="4" fill="#f1f5f9"/>
  <text x="762" y="436" font-family="Inter, system-ui, sans-serif" font-size="7" fill="#475569" text-anchor="middle">TLS 1.2+</text>
  
  <!-- Server to SendGrid -->
  <path d="M 700 430 L 1000 490" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- ==================== WARNING BOX (Red) ==================== -->
  <rect x="40" y="560" width="300" height="100" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
  <text x="60" y="585" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#dc2626">⛔ Data NOT Sent to AI Services:</text>
  <text x="60" y="608" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#7f1d1d">• Passwords or authentication tokens</text>
  <text x="60" y="626" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#7f1d1d">• Payment details or billing information</text>
  <text x="60" y="644" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#7f1d1d">• Session tokens or API keys</text>
  
  <!-- ==================== DATA RETENTION BOX ==================== -->
  <rect x="40" y="680" width="300" height="110" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
  <text x="60" y="705" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534">📋 Data Retention Policy</text>
  <text x="60" y="728" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#14532d">• Active accounts: Data retained during subscription</text>
  <text x="60" y="745" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#14532d">• Cancelled accounts: 30-day grace period</text>
  <text x="60" y="762" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#14532d">• Audit logs: 7-year retention</text>
  <text x="60" y="779" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#14532d">• Deletion requests: Processed within 30 days</text>
  
  <!-- ==================== LEGEND ==================== -->
  <rect x="820" y="600" width="340" height="130" rx="8" fill="#fff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="840" y="625" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1e293b">Legend</text>
  
  <!-- Legend items -->
  <line x1="840" y1="645" x2="880" y2="645" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="895" y="649" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#475569">Data flow (TLS 1.2+ encrypted)</text>
  
  <rect x="840" y="660" width="30" height="16" rx="4" fill="#8b5cf6"/>
  <text x="895" y="673" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#475569">AI Service Provider</text>
  
  <rect x="840" y="685" width="30" height="16" rx="4" fill="#059669"/>
  <text x="895" y="698" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#475569">Database (encrypted at rest)</text>
  
  <circle cx="855" cy="718" r="8" fill="#22c55e"/>
  <text x="855" y="721" font-family="Inter, system-ui, sans-serif" font-size="8" fill="#fff" text-anchor="middle">✓</text>
  <text x="895" y="722" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#475569">No training on customer data</text>
  
  <!-- ==================== VERSION FOOTER ==================== -->
  <text x="600" y="860" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Version 1.0 — December 2025</text>
  <text x="600" y="878" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#cbd5e1" text-anchor="middle">CIM Share Security Architecture • Confidential</text>
  
</svg>
